    <!-- iOS ignora los iconos del manifest y necesita estas etiquetas. -->

    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1290x2796.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* El 100% de iOS no sigue a la barra de Safari: al irse deja un hueco abajo. */
        height: 100dvh;
        background: #120608;
      }
      body {
        overflow: hidden;
        /* Sin el rebote de Safari al tirar más allá del borde. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Por debajo de 16px, Safari hace zoom en la página al enfocar un campo. */
      input,
      textarea {
        font-size: 16px !important;
        user-select: text;
        -webkit-user-select: text;
      }

      /* Intro: arranca igual que el splash de iOS (el icono centrado) y el icono cobra vida. */
      :root {
        --stage: min(86vw, 50vh, 440px);
        /* El iris se abre desde el rollo de la "O". */
        --iris-x: calc(50% + var(--stage) * 0.0306);
        --iris-y: calc(50% - var(--stage) * 0.1888);
      }
      html.intro-on #root {
        position: relative;
        z-index: 1;
        clip-path: circle(0 at var(--iris-x) var(--iris-y));
      }
      html.intro-out #root {
        clip-path: circle(100vmax at var(--iris-x) var(--iris-y));
        transition: clip-path 0.56s cubic-bezier(0.6, 0, 0.2, 1);
      }
      #intro {
        display: none;
      }
      html.intro-on #intro {
        display: block;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #120608;
      }
      .disc {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 32vmax;
        height: 32vmax;
        margin: -16vmax 0 0 -16vmax;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side,
          #7c0d22 calc(100% - 100% / var(--k)),
          #d7263d calc(100% - 58% / var(--k)),
          #f2b233 calc(100% - 38% / var(--k)),
          #7c0d22 100%
        );
        transform: scale(var(--k));
        animation: disc 0.62s cubic-bezier(0.16, 0.9, 0.3, 1) calc(0.16s + (var(--k) - 1) * 0.045s) backwards;
        will-change: transform;
      }
      .card,
      .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--stage);
        height: var(--stage);
        margin: calc(var(--stage) / -2) 0 0 calc(var(--stage) / -2);
        animation: stage 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) 0.16s backwards;
      }
      .card {
        border-radius: 22%;
        background: radial-gradient(
          circle closest-side,
          #120608 42%,
          #7c0d22 42%,
          #d7263d 56%,
          #f2b233 63%,
          #7c0d22 75%,
          #d7263d 89%,
          #f2b233 96%,
          #7c0d22 108%
        );
        animation: stage 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) 0.16s backwards, card 0.18s linear 0.2s both;
      }
      .hole {
        position: absolute;
        left: 26%;
        top: 26%;
        width: 48%;
        height: 48%;
        border-radius: 50%;
        background: #120608;
      }
      .hop {
        position: absolute;
        inset: 0;
        animation: hop 0.38s ease-out calc(0.4s + var(--i) * 0.05s) backwards;
      }
      .l {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .reel {
        transform-origin: 53.06% 31.12%;
        animation: spin 1.5s linear 0.3s infinite;
      }
      @keyframes disc {
        from {
          transform: scale(0);
        }
      }
      @keyframes card {
        to {
          opacity: 0;
        }
      }
      @keyframes stage {
        from {
          transform: scale(var(--start, 0.4));
        }
      }
      @keyframes hop {
        40% {
          transform: translateY(-5%) rotate(-2.5deg) scale(1.05);
        }
        72% {
          transform: translateY(1%) rotate(1deg) scale(0.98, 1.02);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // Va en línea para pintarse antes que el bundle; la app avisa con __introDone.
      (function () {
        var html = document.documentElement;
        window.__introDone = function () {};
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        html.classList.add('intro-on');
        // Empieza del tamaño del icono en el splash de iOS: 256/750 del ancho.
        var stage = Math.min(innerWidth * 0.86, innerHeight * 0.5, 440);
        html.style.setProperty('--start', String((innerWidth * 0.3413) / stage));
        var started = performance.now();
        var MIN_MS = 1450; // se repite en cada arranque en frío: lo justo para ver el logo
        var ready = false;
        var skip = false;
        var gone = false;
        function reveal() {
          if (gone) return;
          gone = true;
          html.classList.add('intro-out');
          setTimeout(function () {
            html.classList.remove('intro-on', 'intro-out');
            var node = document.getElementById('intro');
            if (node) node.parentNode.removeChild(node);
          }, 620);
        }
        function maybe() {
          if (!ready) return;
          var wait = skip ? 0 : MIN_MS - (performance.now() - started);
          if (wait > 0) setTimeout(reveal, wait);
          else reveal();
        }
        window.__introDone = function () {
          ready = true;
          maybe();
        };
        addEventListener('pointerdown', function () {
          skip = true;
          maybe();
        }, { once: true });
        // Si la app no llega a arrancar, que no se quede el logo girando para siempre.
        setTimeout(reveal, 15000);
      })();
    </script>
  </head>
