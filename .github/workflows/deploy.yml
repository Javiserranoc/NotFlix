name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: los tests usan node:sqlite.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Da la subruta real: /NotFlix aquí, vacía con dominio propio.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
